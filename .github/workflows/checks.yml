name: Source and lightweight tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: python scripts/check_release.py
      - run: python -m unittest discover -s code/atomvla-evaluation/tests -v
      - run: python -m unittest discover -s code/atomvla-semantic-data/production -v
      - run: python -m unittest discover -s code/atomvla-endpoints -p 'test_*.py' -v
      - run: python -m unittest discover -s code/atomvla-atomic-runtime -v
